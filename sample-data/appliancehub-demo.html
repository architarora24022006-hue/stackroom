<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ApplianceHub — Home Appliances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F1EC; --surface: #FFFFFF; --ink: #23231F; --ink-soft: #6B685F;
    --line: #E2DFD5; --accent: #B5482E; --accent-hover: #963A24; --accent-soft: #F3E3DE;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--ink); }
  h1, h2 { font-family: 'Fraunces', serif; margin: 0; }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; }
  header .brand { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; }
  header .tag { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.05em; text-transform: uppercase; }
  .hero { padding: 40px 32px 16px; max-width: 1100px; margin: 0 auto; }
  .hero h1 { font-size: 32px; margin-bottom: 8px; }
  .hero p { color: var(--ink-soft); font-size: 15px; max-width: 620px; }

  .tabs { max-width: 1100px; margin: 24px auto 0; padding: 0 32px; display: flex; gap: 6px; border-bottom: 2px solid var(--line); }
  .tab-btn { background: transparent; border: none; padding: 10px 16px; margin-bottom: -2px; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }

  .grid { max-width: 1100px; margin: 0 auto; padding: 24px 32px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .grid.hidden { display: none; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .card .badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; }
  .card h3 { font-size: 17px; margin-bottom: 4px; }
  .card .brand-type { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; }
  .card .price { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .card .features { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; min-height: 56px; }
  .card .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--ink-soft); }
  .card .meta span { background: var(--bg); padding: 3px 8px; border-radius: 999px; }

  #chat-toggle { position: fixed; bottom: 24px; right: 24px; z-index: 50; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 14px 20px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
  #chat-toggle:hover { background: var(--accent-hover); }
  #chat-panel { position: fixed; bottom: 24px; right: 24px; z-index: 50; width: 360px; max-width: 90vw; height: 480px; max-height: 78vh; background: var(--surface); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); display: none; flex-direction: column; overflow: hidden; }
  #chat-panel.open { display: flex; }
  #chat-header { background: var(--accent); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
  #chat-header .title { font-weight: 700; font-size: 14px; }
  #chat-header .sub { font-size: 11px; opacity: 0.85; }
  #chat-close { background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.4; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.bot { align-self: flex-start; background: var(--bg); color: var(--ink); }
  .msg.thinking { align-self: flex-start; font-size: 12.5px; color: var(--ink-soft); }
  #chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  #chat-input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font-family: inherit; font-size: 13.5px; }
  #chat-send { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  #chat-send:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">ApplianceHub</div>
    <div class="tag">home appliances, made simple</div>
  </div>
</header>

<div class="hero">
  <h1>Home Appliances</h1>
  <p>Washing machines, TVs, and air conditioners — browse below, or ask our assistant anything (works across all categories). Click the chat button in the corner.</p>
</div>

<div class="tabs">
  <button class="tab-btn active" data-cat="washing">Washing Machines</button>
  <button class="tab-btn" data-cat="tv">Televisions</button>
  <button class="tab-btn" data-cat="ac">Air Conditioners</button>
</div>

<div class="grid" id="grid-washing"></div>
<div class="grid hidden" id="grid-tv"></div>
<div class="grid hidden" id="grid-ac"></div>

<button id="chat-toggle">💬 Ask about our products</button>
<div id="chat-panel">
  <div id="chat-header">
    <div>
      <div class="title">ApplianceHub Assistant</div>
      <div class="sub">washing machines · TVs · ACs</div>
    </div>
    <button id="chat-close">✕</button>
  </div>
  <div id="chat-messages"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="e.g. best AC for a 150 sq ft room?" autocomplete="off" />
    <button id="chat-send" type="submit">→</button>
  </form>
</div>

<script>
// ---- CONFIGURE THESE TWO VALUES ----
const STACKROOM_BACKEND_URL = "http://localhost:8080";
// Upload washing-machines.csv, televisions.csv, and air-conditioners.csv all into
// the SAME repository so the chatbot can answer across all three categories.
const STACKROOM_REPOSITORY_ID = "6f600fea-10d0-40a8-8ad1-6ae1346a7993";
// -------------------------------------

const washingMachines = [
  { name: "AquaSpin Pro 700", brand: "AquaSpin", type: "Front Load", capacity: "7 kg", price: "₹28,999", rating: "5 Star",
    features: "Inverter motor, Steam wash, 1200 RPM spin, Allergen removal cycle", best: "Small–medium families" },
  { name: "CleanWave Top 65", brand: "CleanWave", type: "Top Load", capacity: "6.5 kg", price: "₹15,999", rating: "3 Star",
    features: "Fuzzy logic sensor, Rust-free body, 3D wash technology, Child lock", best: "First-time buyers" },
  { name: "TurboDry Combo 8", brand: "TurboDry", type: "Front Load + Dryer", capacity: "8 kg / 5 kg dry", price: "₹42,999", rating: "4 Star",
    features: "Wash & dry in one, Sensor drying, Anti-crease, Wi-Fi app control", best: "No balcony drying space" },
  { name: "EcoWash Mini 55", brand: "EcoWash", type: "Top Load", capacity: "5.5 kg", price: "₹12,499", rating: "4 Star",
    features: "Compact design, Low water usage, Soft close lid", best: "Bachelors, compact spaces" },
  { name: "PowerJet Ultra 90", brand: "PowerJet", type: "Front Load", capacity: "9 kg", price: "₹54,999", rating: "5 Star",
    features: "AI load sensing, Steam sanitize, 1400 RPM, 15-min quick wash", best: "Large families" },
  { name: "SilentCare 70", brand: "SilentCare", type: "Front Load", capacity: "7 kg", price: "₹31,999", rating: "5 Star",
    features: "Ultra-quiet motor, Vibration reduction, Baby care cycle", best: "Homes with babies" },
  { name: "ValueSpin Basic 62", brand: "ValueSpin", type: "Top Load", capacity: "6.2 kg", price: "₹10,999", rating: "3 Star",
    features: "Manual dial control, Rat-away technology, Wide door", best: "Tight budgets" },
  { name: "SmartHome Twin 8Plus", brand: "SmartHome", type: "Front Load", capacity: "8 kg", price: "₹47,999", rating: "5 Star",
    features: "Wi-Fi & voice control, Auto-detergent dispenser, Steam refresh", best: "Tech-savvy homes" },
  { name: "FreshAir Dual 75", brand: "FreshAir", type: "Top Load", capacity: "7.5 kg", price: "₹18,999", rating: "4 Star",
    features: "Air dry function, Double waterfall wash, Auto-restart", best: "Balanced price & features" },
  { name: "ProLaundry Commercial 10", brand: "ProLaundry", type: "Front Load", capacity: "10 kg", price: "₹68,999", rating: "5 Star",
    features: "Heavy-duty motor, Commercial-grade drum, Auto-dosing", best: "Hostels, home laundry business" },
];

const televisions = [
  { name: "VividView 43 Smart", brand: "VividView", type: "43\" LED", capacity: "Full HD", price: "₹22,999", rating: "Android TV",
    features: "HDR10, Dual-band Wi-Fi, Bezel-less design", best: "Bedrooms, secondary TV" },
  { name: "CrystalClear 50 UHD", brand: "CrystalClear", type: "50\" LED", capacity: "4K Ultra HD", price: "₹34,999", rating: "Google TV",
    features: "HDR10+, Dolby Vision, Voice remote", best: "Living rooms, family viewing" },
  { name: "PixelPro OLED 55", brand: "PixelPro", type: "55\" OLED", capacity: "4K Ultra HD", price: "₹89,999", rating: "WebOS",
    features: "Self-lit pixels, Perfect blacks, Dolby Atmos", best: "Home theatre enthusiasts" },
  { name: "FrameStyle 43 Art", brand: "FrameStyle", type: "43\" LED", capacity: "4K Ultra HD", price: "₹38,999", rating: "Tizen",
    features: "Art mode, Slim wall-mount, Matte display", best: "Design-conscious buyers" },
  { name: "GameVision 65 Pro", brand: "GameVision", type: "65\" QLED", capacity: "4K Ultra HD", price: "₹79,999", rating: "Google TV",
    features: "144Hz refresh, Low input lag, VRR support", best: "Gamers" },
  { name: "ValueScreen 32 HD", brand: "ValueScreen", type: "32\" LED", capacity: "HD Ready", price: "₹10,999", rating: "Linux based",
    features: "Basic smart features, USB media playback", best: "Kitchens, small rooms" },
  { name: "UltraBright 75 Mega", brand: "UltraBright", type: "75\" QLED", capacity: "8K Ultra HD", price: "₹1,89,999", rating: "Tizen",
    features: "8K upscaling, Quantum HDR, Object tracking sound", best: "Premium home theatres" },
  { name: "EcoView 40 Basic", brand: "EcoView", type: "40\" LED", capacity: "Full HD", price: "₹17,999", rating: "Android TV",
    features: "Low power use, Simple remote, Wall-mountable", best: "Guest rooms" },
  { name: "StudioSound 55 Cinema", brand: "StudioSound", type: "55\" QLED", capacity: "4K Ultra HD", price: "₹54,999", rating: "Google TV",
    features: "Built-in soundbar speakers, Filmmaker mode", best: "Movie nights on a budget" },
  { name: "CompactSmart 32 Plus", brand: "CompactSmart", type: "32\" LED", capacity: "HD Ready", price: "₹13,499", rating: "Android TV",
    features: "Compact size, Screen mirroring", best: "Dorm rooms, small apartments" },
];

const airConditioners = [
  { name: "FrostFlow Split 1Ton", brand: "FrostFlow", type: "Split AC", capacity: "1 Ton", price: "₹29,999", rating: "3 Star",
    features: "Turbo cooling, Auto-restart, Sleep mode", best: "Small bedrooms up to 120 sq ft" },
  { name: "ChillMax Split 1.5Ton", brand: "ChillMax", type: "Split AC", capacity: "1.5 Ton", price: "₹38,999", rating: "5 Star",
    features: "Inverter compressor, Wi-Fi control, Low noise", best: "Medium rooms up to 150 sq ft" },
  { name: "PolarBreeze Window 1Ton", brand: "PolarBreeze", type: "Window AC", capacity: "1 Ton", price: "₹24,999", rating: "3 Star",
    features: "Compact fit, Auto swing, Dehumidifier mode", best: "Single rooms, window fitting" },
  { name: "IceCore Split 2Ton", brand: "IceCore", type: "Split AC", capacity: "2 Ton", price: "₹52,999", rating: "4 Star",
    features: "Fast cooling, PM 2.5 filter, Self-clean", best: "Large rooms up to 200 sq ft" },
  { name: "EcoAir Inverter 1.5Ton", brand: "EcoAir", type: "Split AC", capacity: "1.5 Ton", price: "₹44,999", rating: "5 Star",
    features: "Dual inverter, Low power bills, Smart diagnosis", best: "Energy-conscious households" },
  { name: "BudgetCool Window 1.5Ton", brand: "BudgetCool", type: "Window AC", capacity: "1.5 Ton", price: "₹27,999", rating: "3 Star",
    features: "Value pricing, Basic remote, Rotary compressor", best: "Tight budgets, rentals" },
  { name: "SilentBreeze Split 1Ton", brand: "SilentBreeze", type: "Split AC", capacity: "1 Ton", price: "₹33,999", rating: "5 Star",
    features: "Ultra-quiet mode, Sleep curve tech", best: "Light sleepers, bedrooms" },
  { name: "PowerCool Split 2.5Ton", brand: "PowerCool", type: "Split AC", capacity: "2.5 Ton", price: "₹64,999", rating: "4 Star",
    features: "Extra-large capacity, Commercial-grade cooling", best: "Offices, shops, large spaces" },
  { name: "SmartClimate Split 1.5Ton", brand: "SmartClimate", type: "Split AC", capacity: "1.5 Ton", price: "₹47,999", rating: "5 Star",
    features: "App & voice control, Weather-adaptive cooling", best: "Tech-savvy households" },
  { name: "ValueChill Window 1Ton", brand: "ValueChill", type: "Window AC", capacity: "1 Ton", price: "₹22,999", rating: "3 Star",
    features: "Entry-level pricing, Easy installation", best: "First-time AC buyers" },
];

function renderGrid(elId, items) {
  document.getElementById(elId).innerHTML = items.map(p => `
    <div class="card">
      <span class="badge">${p.rating}</span>
      <h3>${p.name}</h3>
      <div class="brand-type">${p.brand} · ${p.type}</div>
      <div class="price">${p.price}</div>
      <div class="features">${p.features}</div>
      <div class="meta"><span>${p.capacity}</span><span>${p.best}</span></div>
    </div>
  `).join('');
}
renderGrid('grid-washing', washingMachines);
renderGrid('grid-tv', televisions);
renderGrid('grid-ac', airConditioners);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('grid-washing').classList.toggle('hidden', btn.dataset.cat !== 'washing');
    document.getElementById('grid-tv').classList.toggle('hidden', btn.dataset.cat !== 'tv');
    document.getElementById('grid-ac').classList.toggle('hidden', btn.dataset.cat !== 'ac');
  });
});

// ---- Chat widget logic ----
const toggleBtn = document.getElementById('chat-toggle');
const closeBtn = document.getElementById('chat-close');
const panel = document.getElementById('chat-panel');
const messagesEl = document.getElementById('chat-messages');
const form = document.getElementById('chat-form');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('chat-send');

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

addMessage("Hi! Ask me anything about our washing machines, TVs, or air conditioners — features, prices, or what fits your needs.", 'bot');

toggleBtn.addEventListener('click', () => { panel.classList.add('open'); toggleBtn.style.display = 'none'; });
closeBtn.addEventListener('click', () => { panel.classList.remove('open'); toggleBtn.style.display = 'block'; });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMessage(question, 'user');
  input.value = '';
  sendBtn.disabled = true;
  const thinkingEl = addMessage('Thinking…', 'thinking');

  try {
    const res = await fetch(`${STACKROOM_BACKEND_URL}/api/public/repositories/${STACKROOM_REPOSITORY_ID}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    thinkingEl.remove();
    if (!res.ok) {
      addMessage("Sorry, I couldn't reach the assistant right now.", 'bot');
      return;
    }
    const data = await res.json();
    addMessage(data.answer, 'bot');
  } catch (err) {
    thinkingEl.remove();
    addMessage("Sorry, something went wrong reaching the assistant.", 'bot');
  } finally {
    sendBtn.disabled = false;
  }
});
</script>

</body>
</html>
